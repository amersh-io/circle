name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # circle needs no window system: it runs on Linux and on Apple silicon,
    # the platforms scripts/bootstrap pins. CI uses the stand-in CLI.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache the toolchain and dependencies
        uses: actions/cache@v4
        with:
          path: |
            .local
            .qlot
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/bootstrap', 'qlfile.lock') }}

      - name: Bootstrap SBCL and qlot
        run: scripts/bootstrap

      - name: Run the tests
        run: |
          scripts/test > test.log 2>&1 || true
          grep -E '^(ok|FAIL)' test.log || true
          grep -q '^ALL-TESTS-PASSED' test.log || { grep -v -E '^(ok |; )' test.log | tail -200; exit 1; }

      - name: Keep the test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.os }}
          path: test.log
